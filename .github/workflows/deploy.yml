name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize deploys per environment. Prod never races itself; each PR
# serializes against itself but PRs don't block each other.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip on PRs from forks: secrets aren't available there, and we don't want
    # to expose deploy credentials to untrusted code anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

      - name: compute deploy vars
        id: vars
        env:
          FULL_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SHA="${FULL_SHA:0:7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "version=${SHA}-preview"
              echo "sha=${FULL_SHA}"
              echo "target=itspartyti.me-preview"
              echo "service=me.itspartyti.preview"
              echo "port=8091"
              echo "label=preview"
              echo "is_preview=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "version=${SHA}"
              echo "sha=${FULL_SHA}"
              echo "target=itspartyti.me"
              echo "service=me.itspartyti.server"
              echo "port=8090"
              echo "label=prod"
              echo "is_preview=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: build, swap, restart, verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SERVICE: ${{ steps.vars.outputs.service }}
          PORT: ${{ steps.vars.outputs.port }}
          LABEL: ${{ steps.vars.outputs.label }}
          IS_PREVIEW: ${{ steps.vars.outputs.is_preview }}
          SHA: ${{ steps.vars.outputs.sha }}
          VERSION: ${{ steps.vars.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 2222
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: SERVICE,PORT,LABEL,IS_PREVIEW,SHA,VERSION
          script: |
            set -euo pipefail
            export PATH="/opt/homebrew/bin:$PATH"
            PROD_REPO="$HOME/itspartyti.me"

            if [ "$IS_PREVIEW" = "true" ]; then
              DEPLOY_DIR="$HOME/itspartyti.me-preview"
              WORKTREE=$(mktemp -d)
              trap 'git -C "$PROD_REPO" worktree remove --force "$WORKTREE" 2>/dev/null || true; rm -rf "$WORKTREE"' EXIT
              git -C "$PROD_REPO" fetch origin
              git -C "$PROD_REPO" worktree add "$WORKTREE" "$SHA"
              BUILD_DIR="$WORKTREE"
            else
              DEPLOY_DIR="$HOME/itspartyti.me"
              git -C "$PROD_REPO" pull origin main
              BUILD_DIR="$PROD_REPO"
            fi

            go build -C "$BUILD_DIR" \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "$DEPLOY_DIR/server.new" \
              ./cmd/server

            cd "$DEPLOY_DIR"
            if [ -f server ]; then mv -f server server.prev; fi
            mv -f server.new server

            launchctl kickstart -k "gui/$(id -u)/$SERVICE"

            for i in $(seq 1 30); do
              if HEALTH=$(curl -sf "http://localhost:${PORT}/health"); then
                echo "deployed ${LABEL}: $HEALTH"
                exit 0
              fi
              sleep 1
            done

            echo "health check timed out; rolling back"
            if [ -f server.prev ]; then
              mv -f server.prev server
              launchctl kickstart -k "gui/$(id -u)/$SERVICE" || true
            fi
            exit 1
